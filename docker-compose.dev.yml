# Local development database only — a PostgreSQL dedicated to this app, on
# host port 5433 so it never collides with another project's Postgres.
#
#   docker compose -f docker-compose.dev.yml --env-file .env up -d
#
# The password comes from POSTGRES_PASSWORD in .env (never committed).
# For production, see docker-compose.yml.
name: internship-dev

services:
  db:
    image: postgres:17-alpine
    container_name: internship_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: internship
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: internship
    ports:
      # Loopback only: the database is never reachable from the network.
      - "127.0.0.1:5433:5432"
    volumes:
      - internship_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internship -d internship"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  internship_pgdata:
